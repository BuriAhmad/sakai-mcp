[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sakai-mcp"
version = "0.2.0"
description = "Delegated Sakai MCP service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mcp==2.2.0",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.15.0",
  "msal==1.39.0",
  "requests==2.34.2",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "azure-storage-blob==12.30.2",
  "azure-identity==1.26.0",
  "aiohttp==3.14.5",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[tool.hatch.build]
exclude = ["**/.vscode/**", "**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/sakai_mcp/**/*.py",
  "/tests/**/*.py",
  "/tests/contracts/*.json",
  "/tests/fixtures/**/*.json",
  "/pyproject.toml",
  "/README.md",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sakai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
# Stored grading provenance hashes the evaluator function's exact source text.
exclude = ["src/sakai_mcp/grading/evaluator.py"]

[tool.mypy]
python_version = "3.11"
packages = ["sakai_mcp"]
disallow_untyped_defs = true
