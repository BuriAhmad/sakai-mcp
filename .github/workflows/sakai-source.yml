name: Validate Sakai source

on:
  push:
    paths:
      - 'apps/sakai/**'
      - '.github/workflows/sakai-source.yml'
  pull_request:
    paths:
      - 'apps/sakai/**'
      - '.github/workflows/sakai-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-pom:
    name: Sakai parent POM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/sakai/master/pom.xml

      - name: Validate Sakai parent POM
        run: mvn -B -ntp -f apps/sakai/master/pom.xml validate
